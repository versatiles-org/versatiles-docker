name: Build Docker Images
on:
  schedule:
    - cron: '0 0 * * 4' # Every Thursday at midnight UTC
  repository_dispatch:
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Build base image'
        required: false
        type: boolean
        default: true
      build_frontend:
        description: 'Build frontend image'
        required: false
        type: boolean
        default: true
      build_nginx:
        description: 'Build nginx image'
        required: false
        type: boolean
        default: true
      build_tippecanoe:
        description: 'Build tippecanoe image'
        required: false
        type: boolean
        default: true
      build_tilemaker:
        description: 'Build tilemaker image'
        required: false
        type: boolean
        default: true
      build_gdal:
        description: 'Build gdal image'
        required: false
        type: boolean
        default: true
      build_planetiler:
        description: 'Build planetiler image'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: 1
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  # Authenticates GitHub REST API calls in build scripts (fetch_release_tag),
  # raising the rate limit from 60 to ~1000 req/hr to avoid HTTP 403 across
  # the parallel build jobs.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base:
    name: Build versatiles
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_base }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: bash ./versatiles/build.sh --test --push

  build-frontend:
    name: Build versatiles-frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_frontend }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: bash ./versatiles-frontend/build.sh --test --push

  build-nginx:
    name: Build versatiles-nginx
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_nginx }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: bash ./versatiles-nginx/build.sh --test --push

  build-tippecanoe:
    name: Build versatiles-tippecanoe
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_tippecanoe }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: bash ./versatiles-tippecanoe/build.sh --test --push

  # ---------------------------------------------------------------------------
  # versatiles-tilemaker is built one architecture per NATIVE runner, then merged.
  # As a single emulated multi-arch job it took 112m (gdal) / 56m (tilemaker);
  # natively each architecture is ~8-10m and they run in parallel.
  # Tags are only created by the merge step, so a failed arch never leaves a
  # tag pointing at a single-architecture image.
  # ---------------------------------------------------------------------------
  build-tilemaker:
    name: Build versatiles-tilemaker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_tilemaker }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test and push ${{ matrix.arch }} by digest
        id: build
        run: bash ./versatiles-tilemaker/build.sh --test --push-arch

      - name: Stash digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" >"/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-tilemaker-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-tilemaker:
    name: Merge versatiles-tilemaker
    needs: build-tilemaker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-tilemaker-*
          path: /tmp/digests
          merge-multiple: true

      - name: Merge into the tagged multi-arch manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digests=$(cat /tmp/digests/* | tr '\n' ' ')
          echo "merging: $digests"
          MERGE_DIGESTS="$digests" bash ./versatiles-tilemaker/build.sh --merge

  build-gdal:
    name: Build versatiles-gdal (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_gdal }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test and push ${{ matrix.arch }} by digest
        id: build
        run: bash ./versatiles-gdal/build.sh --test --push-arch

      - name: Stash digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" >"/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-gdal-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-gdal:
    name: Merge versatiles-gdal
    needs: build-gdal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-gdal-*
          path: /tmp/digests
          merge-multiple: true

      - name: Merge into the tagged multi-arch manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digests=$(cat /tmp/digests/* | tr '\n' ' ')
          echo "merging: $digests"
          MERGE_DIGESTS="$digests" bash ./versatiles-gdal/build.sh --merge

  build-planetiler:
    name: Build versatiles-planetiler
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_planetiler }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-docker
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: bash ./versatiles-planetiler/build.sh --test --push

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-base, build-frontend, build-nginx, build-tippecanoe, merge-tilemaker, merge-gdal, build-planetiler]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Check build results
        run: |
          failed=0

          if [ "${{ needs.build-base.result }}" == "failure" ]; then
            echo "❌ versatiles build failed"
            failed=1
          fi

          if [ "${{ needs.build-frontend.result }}" == "failure" ]; then
            echo "❌ versatiles-frontend build failed"
            failed=1
          fi

          if [ "${{ needs.build-nginx.result }}" == "failure" ]; then
            echo "❌ versatiles-nginx build failed"
            failed=1
          fi

          if [ "${{ needs.build-tippecanoe.result }}" == "failure" ]; then
            echo "❌ versatiles-tippecanoe build failed"
            failed=1
          fi

          if [ "${{ needs.merge-tilemaker.result }}" == "failure" ]; then
            echo "❌ versatiles-tilemaker build failed"
            failed=1
          fi

          if [ "${{ needs.merge-gdal.result }}" == "failure" ]; then
            echo "❌ versatiles-gdal build failed"
            failed=1
          fi

          if [ "${{ needs.build-planetiler.result }}" == "failure" ]; then
            echo "❌ versatiles-planetiler build failed"
            failed=1
          fi

          if [ $failed -eq 1 ]; then
            echo "❌ One or more builds failed"
            exit 1
          fi

          echo "✅ All builds completed successfully"