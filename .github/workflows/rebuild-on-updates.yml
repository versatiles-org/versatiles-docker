name: Rebuild on Updates

# -----------------------------------------------------------------------------
# Daily: rebuilds an image as soon as its distribution has released package
# updates for it, instead of waiting for the weekly build on Thursday. That
# matters most for versatiles-nginx, which faces the internet and gets nginx,
# certbot and OpenSSL from Alpine.
#
# scripts/check_updates.sh asks each published image's package manager (on
# Alpine any update, on Debian and Ubuntu the security archive), for amd64 and
# arm64 each. For the images
# that lack updates, release.yml is started with only their build inputs set,
# and with the current time as BUILD_DATE, so the upgrade layers miss the cache
# even on a day that already had a build. A rebuild pushes the same tags as the
# weekly build (latest and the current version), with the newest packages.
#
# The log names only the images that get rebuilt, never the packages: which
# packages a published image lacks is a security finding, and this
# repository's logs are public. `scripts/check_updates.sh --list <image>` shows
# them by hand.
# -----------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to start release.yml

concurrency:
  group: rebuild-on-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check images and rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The arm64 variants run in emulation. Alpine builds each architecture's
      # packages separately, so an update can reach arm64 first, or amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Check the published images
        id: check
        run: |
          failed=false
          any=false
          # outdated <release input> <image…>: sets the input to true when any
          # of the images lacks updates, on either architecture.
          outdated() {
            local input=$1 image platform code value=false
            shift
            for image in "$@"; do
              for platform in linux/amd64 linux/arm64; do
                code=0
                scripts/check_updates.sh --platform "$platform" "$image" || code=$?
                case $code in
                  0) value=true ;;
                  1) ;;
                  *) failed=true ;;
                esac
              done
            done
            echo "$input=$value" >>"$GITHUB_OUTPUT"
            if $value; then
              any=true
              echo "$input: rebuild"
            else
              echo "$input: up to date"
            fi
          }
          outdated build_base versatiles/versatiles:latest-alpine versatiles/versatiles:latest-debian
          outdated build_frontend versatiles/versatiles-frontend:latest-alpine versatiles/versatiles-frontend:latest-debian
          outdated build_nginx versatiles/versatiles-nginx:latest
          outdated build_tippecanoe versatiles/versatiles-tippecanoe:latest
          outdated build_gdal versatiles/versatiles-gdal:latest
          outdated build_planetiler versatiles/versatiles-planetiler:latest
          echo "any=$any" >>"$GITHUB_OUTPUT"
          # An image that can't be checked fails the run (GitHub's failure
          # email), after the others were checked and rebuilt.
          echo "failed=$failed" >>"$GITHUB_OUTPUT"

      - name: Start the release for the outdated images
        if: steps.check.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.check.outputs.build_base }}
          FRONTEND: ${{ steps.check.outputs.build_frontend }}
          NGINX: ${{ steps.check.outputs.build_nginx }}
          TIPPECANOE: ${{ steps.check.outputs.build_tippecanoe }}
          GDAL: ${{ steps.check.outputs.build_gdal }}
          PLANETILER: ${{ steps.check.outputs.build_planetiler }}
        run: |
          gh workflow run release.yml --ref "$GITHUB_REF_NAME" \
            -f build_base="$BASE" -f build_frontend="$FRONTEND" -f build_nginx="$NGINX" \
            -f build_tippecanoe="$TIPPECANOE" -f build_gdal="$GDAL" -f build_planetiler="$PLANETILER" \
            -f build_date="$(date -u +%FT%T)"

      - name: Fail if an image couldn't be checked
        if: steps.check.outputs.failed == 'true'
        run: |
          echo "At least one image couldn't be checked; see the step above."
          exit 1
